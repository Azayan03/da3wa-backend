services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    networks:
      - app-net
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1024M
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  migration:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["sh", "-c", "node dist/scripts/backfill-users.js && node dist/scripts/sync-indexes.js"]
    restart: "no"
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/invitations
    networks:
      - app-net
    depends_on:
      mongodb:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    stop_grace_period: 15s
    env_file:
      - path: .env
        required: false
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/invitations
      - COOKIE_SECURE=true
    networks:
      - app-net
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    depends_on:
      mongodb:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    networks:
      - app-net
    depends_on:
      api:
        condition: service_healthy

networks:
  app-net:
    driver: bridge

volumes:
  mongodb_data: