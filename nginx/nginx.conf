upstream node_backend {
    # If using Docker Compose single service:
    server api:3000;

    # If running scaled replicas (e.g., docker compose up --scale api=3),
    # Docker's internal DNS handles round-robin if you point to 'api:3000',
    # or you can list explicit replica containers here:
    # server api_1:3000;
    # server api_2:3000;
    
    keepalive 32; # Keep active connections warm to Node.js
}

# ---------------------------------------------------------------------------
# HTTP -> HTTPS Redirect
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name localhost;

    # 301 is standard for canonical HTTPS upgrades
    return 301 https://$host$request_uri;
}

# ---------------------------------------------------------------------------
# HTTPS Reverse Proxy & SSL Termination
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    server_name localhost;

    ssl_certificate     /etc/nginx/certs/nginx-cert.crt;
    ssl_certificate_key /etc/nginx/certs/nginx-private.key;

    # Modern TLS standards
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    location / {
        proxy_pass http://node_backend;

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Fastify / Node keep-alive optimization
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts matching Node long-polling or slow clients
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}